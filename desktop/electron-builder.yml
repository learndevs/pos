appId: com.retailpos.desktop
productName: Retail POS
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: ../server/build/libs/server.jar
    to: server/server.jar
  # Produced by the jlink step (see docs/dev-setup.md, packaging):
  - from: resources/jre
    to: jre
    filter: ["**/*"]
  # TODO(phase 0): bundled PostgreSQL binaries
  # - from: resources/pgsql
  #   to: pgsql
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
