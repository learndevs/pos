# Retail POS Admin Server (runs the admin panel + its database on a shop PC). Windows = production (signed NSIS installer); macOS = unsigned dev/test build.
appId: com.retailpos.adminserver
productName: Retail POS Admin Server
artifactName: RetailPOS-AdminServer-${version}-${os}-${arch}.${ext}
extraMetadata:
  posMode: admin
beforePack: ../packaging/runtime/check-runtimes.cjs
directories:
  output: release/admin
files:
  - dist/**
  - package.json
extraResources:
  - from: ../server/admin-app/build/libs/admin.jar
    to: server/admin.jar
  - from: resources/jre/${os}-${arch}
    to: jre
win:
  target: [{ target: nsis, arch: [x64] }]
  # signing: set CSC_LINK (pfx path/base64) + CSC_KEY_PASSWORD in CI; unset = unsigned test build
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false          # keep the till database (configuration, archive) on uninstall
  include: ../packaging/windows/installer.nsh
mac:
  target: [dmg]                           # CPU: --arm64 / --x64 on the command line (runtimes must be prepared for it)
  identity: null                          # dev/test only: unsigned, not notarized
  category: public.app-category.business
