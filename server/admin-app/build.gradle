// Admin web app (back office): edits master data, publishes releases, serves the change feed to tills.
// Uses the SAME catalog module (entities, rules) and sync-contract as the POS. Own database: pos_admin.
apply plugin: 'org.springframework.boot'

description = 'Retail POS admin'

dependencies {
	implementation project(':platform')
	implementation project(':modules:master-schema')
	implementation project(':modules:catalog')
	implementation project(':modules:menu')
	implementation project(':modules:sync-contract')
	implementation project(':modules:sync-server')

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

// Built admin UI (admin-ui/dist) served same-origin.
tasks.named('processResources') {
	from(rootProject.file('../admin-ui/dist')) {
		into 'static'
	}
}

tasks.named('bootJar') {
	archiveFileName = 'admin.jar'
}

tasks.named('jar') {
	enabled = false
}

// Dev run: profile "admin-local" -> server/config/application-admin-local.properties (git-ignored).
tasks.named('bootRun') {
	workingDir = rootProject.projectDir
	systemProperty 'spring.profiles.active', System.getenv('SPRING_PROFILES_ACTIVE') ?: 'admin-local'
}
