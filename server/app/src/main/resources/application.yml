spring:
  application:
    name: pos-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pos}
    username: ${DB_USER:pos_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  mvc:
    problemdetails:
      enabled: true               # RFC 7807 error bodies
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/master   # POS-only + shared master data

pos:
  launch-token: ${POS_LAUNCH_TOKEN:}   # set by Electron; empty = check disabled (dev)
  sync:
    admin-url: ${POS_SYNC_ADMIN_URL:}          # empty = stand-alone till (no config sync)
    terminal-token: ${POS_SYNC_TOKEN:}
    interval-ms: 60000

server:
  address: 127.0.0.1              # loopback only; Electron talks to us locally
  port: ${SERVER_PORT:8080}       # Electron passes a free port at launch

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
